version: '3.8'

# Explicit project name so this does not collide with the unrelated
# backend-tb-node project (the directory basename is also "backend-tb-node").
name: status-threshold

services:
  status-threshold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: status-threshold
    image: dharshiniradhakrishnan/status-threshold:v0.2
    restart: unless-stopped

    environment:
      # Shifts in ThingsBoard are defined in IST; the monitor's shift math uses
      # local time, so the container must run in IST or alerts get wrongly
      # skipped as "crosses shift boundary".
      - TZ=Asia/Kolkata
      - NODE_ENV=production

    env_file:
      - .env

    volumes:
      # Persists alert-dedup state (data/alert-state.json) across container
      # restarts, so a redeploy while a device is already alarmed/idle/
      # disconnected past threshold doesn't re-send an alert for the same
      # ongoing streak.
      - ./data:/app/data

    # Optional: override specific env vars if needed
    # environment:
    #   - TB_BASE_URL=http://smart.yantra24x7.com:8080
    #   - customer_name=Precicraft CNC Works
    #   - email_from=your-email@gmail.com
    #   - email_pass=your-app-password
    #   - email_to=recipient1@example.com,recipient2@example.com
