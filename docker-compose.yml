version: '3.8'

services:
  # Macro (live_component/live_operator/live_reason) + Alarm processor + Alarm
  # bridge + Sequence report all run inside this ONE container under
  # supervisord. Each is independently restarted on crash — see
  # supervisord.conf. ALL env vars for all four live in the single `.env`
  # file next to this compose file — no per-service overrides needed.
  backend-tb-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-tb-node
    image: dharshiniradhakrishnan/backend-tb-node:v0.2
    restart: unless-stopped

    ports:
      # sequence-report's HTTP reports API (the only HTTP-exposing service
      # of the four; macro/alarm/alarm-bridge are pure MQTT consumers).
      - "6027:6027"

    dns:
      - 1.1.1.1
      - 8.8.4.4

    # Shift math uses local time (new Date(y,m,d,hh,..)) — MUST run in IST or
    # shift boundaries land 5.5h off (e.g. 20:00 shift-end -> 01:30 IST). TZ
    # itself lives in .env alongside everything else.
    env_file:
      - .env
