[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Each program restarts on its own if it crashes — the other two keep running
; unaffected. startretries is high so a program that keeps crash-looping never
; gets permanently given up on (matches the old `restart: unless-stopped`).

[program:macro]
command=sh -c 'node macro_component/app.js 2>&1 | while IFS= read -r line; do echo "[macro] $line"; done'
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=1000000
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:alarm-bridge]
command=sh -c 'node alarm_bridge/bridge.js 2>&1 | while IFS= read -r line; do echo "[alarm-bridge] $line"; done'
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=1000000
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sequence-report]
command=sh -c 'node sequence_report/index.js 2>&1 | while IFS= read -r line; do echo "[sequence-report] $line"; done'
directory=/app
